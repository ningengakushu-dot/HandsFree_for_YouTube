<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 280px;
      padding: 16px;
      font-family: 'Segoe UI', 'Meiryo', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h1 {
      font-size: 14px;
      text-align: center;
      margin-bottom: 12px;
      color: #fff;
    }
    .status {
      text-align: center;
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      background: #16213e;
    }
    .status.active {
      background: #0f3460;
      color: #4ecca3;
    }
    .status.inactive {
      background: #16213e;
      color: #999;
    }
    .status.error {
      background: #3a0a0a;
      color: #e74c3c;
    }
    .commands {
      font-size: 11px;
      line-height: 1.6;
      background: #16213e;
      padding: 10px;
      border-radius: 6px;
    }
    .commands h2 {
      font-size: 12px;
      margin-bottom: 6px;
      color: #4ecca3;
    }
    .commands table {
      width: 100%;
      border-collapse: collapse;
    }
    .commands td {
      padding: 2px 4px;
    }
    .commands td:first-child {
      color: #aaa;
      width: 45%;
    }
    .commands td:last-child {
      color: #e0e0e0;
    }
    .note {
      font-size: 10px;
      color: #777;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🎙 YouTube Voice Control</h1>
  <div id="status" class="status inactive">YouTube ページを開いてください</div>
  <div class="commands">
    <h2>音声コマンド一覧</h2>
    <table>
      <tr><td>再生</td><td>再生・スタート</td></tr>
      <tr><td>停止</td><td>停止・ストップ・ポーズ</td></tr>
      <tr><td>速度変更</td><td>1倍速 / 2倍速 / 5倍速</td></tr>
      <tr><td>速度解除</td><td>解除</td></tr>
      <tr><td>スキップ</td><td>10秒スキップ / 5分スキップ</td></tr>
      <tr><td>広告スキップ</td><td>広告スキップ</td></tr>
    </table>
  </div>
  <div class="note">YouTube動画ページでマイクボタンをクリック</div>
  <script src="popup.js"></script>
</body>
</html>
